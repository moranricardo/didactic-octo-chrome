name: El Toroide Adiamantado

on:
  workflow_dispatch:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci || npm install

      - name: Otorgar permisos de ejecución a binaries y scripts
        run: chmod +x ./bin/*.sh *.sh 2>/dev/null || true

      - name: Ejecutar Motor de Análisis (Node.js)
        run: node index.cjs
        env:
          NODE_ENV: production
